# NeuralBridge Language File — Deutsch (German)
# Derived from en_gb.yaml (British English — default and source of truth).
#
# Keys must exactly match those in en_gb.yaml.
# Missing keys fall back automatically to en_gb.yaml at runtime.

language:
  name: "Deutsch"
  code: "de"

# ── Agent type selector labels ─────────────────────────────────────────────────
agent_types:
  home_assistant: "Home Assistant (Eingebaut)"
  existing_integration: "Bestehende Integration (Gemini, ChatGPT, usw.)"
  ollama: "Ollama (Extern)"
  web_search: "Websuche (Echtzeit-Daten)"

# ── Web search provider labels ────────────────────────────────────────────────
search_providers:
  brave: "Brave AI Suche"

# ── Agent management UI ────────────────────────────────────────────────────────
agent_management:
  status_enabled: "✓ Aktiviert"
  status_disabled: "✗ Deaktiviert"
  action_edit: "Agenteneinstellungen bearbeiten"
  action_enable: "Agenten aktivieren"
  action_disable: "Agenten deaktivieren"
  action_delete: "Agenten löschen"
  no_agents_yet: "Noch keine Agenten konfiguriert."
  default_ha_agent_name: "Home Assistant"

# ── Description placeholder text used inside config flow steps ─────────────────
placeholders:
  priority_info: >-
    1–100 = Verarbeitungspriorität (niedrigerer Wert = höhere Priorität).
    Fügen Sie dedizierte Router-Agenten über "Router-Agent hinzufügen" hinzu.
  web_search_info: >-
    Dieser Agent sendet zeitrelevante Anfragen an eine Websuche-API.
    Das Routing erfolgt automatisch, wenn der Router die Anfrage als
    aktualisierungsbedürftig einstuft.
  routing_agent_info: >-
    Router-Agenten klassifizieren eingehende Anfragen per JSON-Prompt und
    steuern die Agentenauswahl. Sie laufen mit Priorität 0; Caching und
    Sicherheitsfilter sind automatisch deaktiviert, um Schleifen zu vermeiden.
  guard_rails_info: >-
    Sicherheitsfilter laufen auf dem konfigurierten Router-Agenten für schnelles,
    datenschutzfreundliches Inhaltsfiltern. Hybridansatz: zunächst schnelle Regeln,
    dann KI, falls der Schwellenwert nicht erreicht wird.
  no_router_agent_error: >-
    Kein Router-Agent ist konfiguriert.
    Verwenden Sie \"Router-Agent hinzufügen\", um einen leichtgewichtigen Ollama-Agenten
    (z. B. TinyLlama, Qwen) hinzuzufügen, bevor Sie Sicherheitsfilter aktivieren.
  guard_rail_rules_info: >-
    Geben Sie benutzerdefinierte Regex-Muster (eines pro Zeile) ein, um übereinstimmende Inhalte
    zu blockieren. Muster werden mit den integrierten Standards zusammengeführt. Leer lassen,
    um nur die Standards zu verwenden.

# ── Guard rail rule category labels ───────────────────────────────────────────
guard_rail_categories:
  harmful: "Schädliche Inhaltsmuster"
  privacy: "Datenschutzmuster"
  security: "Sicherheitsmuster"
  inappropriate: "Unangemessene Inhaltsmuster"

# ── Guard rail action selector labels ─────────────────────────────────────────
guard_rail_actions:
  notify_ask: "Benachrichtigen und fragen (Empfohlen)"
  warn: "Warnen (Antwort mit Warnung prefixen)"
  block: "Blockieren (Antwort verhindern)"

# ── Router log level selector labels ──────────────────────────────────────────
router_log_levels:
  none: "None"
  complexity_only: "Complexity level only"
  debug_info: "Debug information"
  debug_with_query: "Debug with query logging (⚠ logs PII)"

# ── Router fallback behaviour selector labels ──────────────────────────────────
router_fallbacks:
  default_complexity: "Use default complexity (fail open)"
  skip_routing: "Skip routing (try all agents in priority order)"
  block: "Block the request"

# ── Runtime response messages returned to the user ────────────────────────────
responses:
  fallback: "Ich habe gerade Probleme, mich mit meinen KI-Agenten zu verbinden. Versuche, deine Anfrage umzuformulieren, oder überprüfe die Agenteneinstellungen."
  no_agents: "Keine KI-Agenten konfiguriert. Bitte fügen Sie Agenten in den Integrationseinstellungen hinzu."
  router_blocked: "Ich kann diese Art von Anfrage nicht bearbeiten."
  guard_rail_blocked: "Ich kann diese Anfrage nicht bearbeiten, da sie möglicherweise schädliche Inhalte enthält."
  guard_rail_warning_prefix: "⚠️ Warnung: Dieser Inhalt könnte sensibel sein. "
  guard_rail_notify_ask: >-
    Diese Antwort könnte schädliche oder sensible Informationen enthalten.
    Möchten Sie fortfahren?

# ── Language settings step ────────────────────────────────────────────────────
language_settings:
  title: "Spracheinstellungen"
  description: >-
    Wählen Sie Ihre bevorzugte Sprache für NeuralBridge-Antworten und die Benutzeroberfläche.
    Laden Sie die Integration nach dieser Änderung neu.
  language_label: "Sprache"
  restart_note: >-
    Die Integration muss neu geladen werden, damit die Sprachänderung vollständig wirksam wird.
