# NeuralBridge Language File — British English (en_GB)
# This is the default language.
#
# To add a new language:
#   1. Copy this file and rename it (e.g. de.yaml, fr.yaml).
#   2. Translate the values (keep the keys exactly as-is).
#   3. Restart or reload the NeuralBridge integration.
#   4. Select the new language in Settings → Integrations → NeuralBridge → Configure.

language:
  name: "English (UK)"
  code: "en_GB"

# ── Agent type selector labels ─────────────────────────────────────────────────
agent_types:
  home_assistant: "HA Intent Processor (Device Control)"
  integrated: "HA Conversation Agent (Gemini, Ollama, ChatGPT…)"
  ollama: "Ollama (External)"
  web_search: "Web Search (Real-time data)"

# ── Agent management UI ────────────────────────────────────────────────────────
agent_management:
  status_enabled: "✓ Enabled"
  status_disabled: "✗ Disabled"
  action_edit: "Edit Agent Settings"
  action_enable: "Enable Agent"
  action_disable: "Disable Agent"
  action_delete: "Delete Agent"
  no_agents_yet: "No agents configured yet."
  default_ha_agent_name: "Home Assistant"

# ── Description placeholder text used inside config flow steps ─────────────────
placeholders:
  priority_info: >-
    1–100 = Processing priority (lower numbers are tried first).
    Configure the routing agent via the "Configure Routing Agent" menu option.
  routing_agent_info: >-
    The routing agent classifies incoming requests using a JSON prompt and guides
    agent selection. It runs at priority 0, with caching and guard rails
    disabled automatically to prevent routing loops.
    Only one routing agent can be configured at a time.
  guard_rails_info: >-
    Guard rails run on the configured routing agent for fast, privacy-preserving
    content filtering. Uses a hybrid approach: fast rules first, then AI if the
    confidence threshold is not met.
  no_router_agent_error: >-
    No routing agent is configured.
    Use "Configure Routing Agent" to select an installed conversation agent
    before enabling guard rails.
  guard_rail_rules_info: >-
    Enter custom regex patterns (one per line) to block matching content.
    Patterns are merged with the built-in defaults. Leave blank to use defaults only.
  high_stakes_info: >-
    When enabled, actions targeting the selected HA domains are intercepted and
    the user is asked to confirm before the action is executed. Optionally require
    a passphrase for stronger security. Leave the passphrase blank to use yes/no confirmation.
  web_search_info: >-
    The web search agent is routed to automatically by the routing agent when
    a query is identified as time-sensitive or requiring current data
    (e.g. news, sports results, current leaders, financial data).
    Queries are never cached by default — disable caching to always fetch fresh results.
    Brave Answers and Brave Combined each require a separate Answers subscription key.
  connection_ok: "\u2713 Connection test passed"

# ── Guard rail rule category labels ───────────────────────────────────────────
guard_rail_categories:
  harmful: "Harmful Content Patterns"
  privacy: "Privacy Patterns"
  security: "Security Patterns"
  inappropriate: "Inappropriate Content Patterns"

# ── Guard rail action selector labels ─────────────────────────────────────────
guard_rail_actions:
  notify_ask: "Notify & Ask (Recommended)"
  warn: "Warn (Prefix with warning)"
  block: "Block (Prevent response)"

# ── Router log level selector labels ──────────────────────────────────────────
router_log_levels:
  none: "None"
  complexity_only: "Complexity level only"
  debug_info: "Debug information"
  debug_with_query: "Debug with query logging (⚠ logs PII)"

# ── Router fallback behaviour selector labels ──────────────────────────────────
router_fallbacks:
  default_complexity: "Use default complexity (fail open)"
  skip_routing: "Skip routing (try all agents in priority order)"
  block: "Block the request"

# ── Router failover plan selector labels ───────────────────────────────────────
router_failover_modes:
  primary_only: "Primary only"
  backup: "Primary + automatic backup"
  priority_order: "Priority order (all routers)"

# ── Routing strategy selector labels ──────────────────────────────────────────
routing_strategies:
  default: "Default (use benchmark ranking)"
  fastest: "Fastest"
  most_capable: "Most capable"
  local_only: "Local only"

# ── Search provider labels ─────────────────────────────────────────────────────
search_providers:
  brave: "Brave AI Search"
  brave_answers: "Brave Answers (Direct answer)"
  brave_combined: "Brave Combined (Answers + Search fallback)"

# ── Runtime response messages returned to the user ────────────────────────────
responses:
  fallback: "I'm having trouble connecting to my AI agents right now. Try rephrasing your request or check your agent settings."
  no_agents: "No AI agents are configured. Please add agents in the integration settings."
  router_blocked: "I cannot process that type of request."
  guard_rail_blocked: "I cannot process this request as it may contain harmful content."
  guard_rail_warning_prefix: "⚠️ Warning: This content may be sensitive. "
  guard_rail_notify_ask: >-
    This response may contain harmful or sensitive information.
    Would you like to continue?
  announce_confirmation: "Announcement broadcast to {count} speaker(s)."
  announce_no_tts: "No text-to-speech (TTS) integration is configured. Please add a TTS integration to use broadcast announcements."
  high_stakes_confirmation: "Are you sure? This action may be irreversible. Please confirm with 'yes' or 'no'."
  high_stakes_passphrase_prompt: "This action requires confirmation. Please say your passphrase to proceed."
  high_stakes_cancelled: "Action cancelled."
  reroute_web_search: "Let me check the web for that. "
  reroute_agent: "Let me try a different approach. "

# ── Language settings step ────────────────────────────────────────────────────
language_settings:
  title: "Language Settings"
  description: >-
    Select your preferred language for NeuralBridge runtime responses and
    interface text. Reload the integration after changing this setting.
  language_label: "Language"
  restart_note: >-
    The integration must be reloaded for the language change to take full effect.
